<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6de88;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4a843;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8922f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Crescent C shape -->
  <path d="M100 10
    A90 90 0 1 0 100 190
    A65 65 0 1 1 100 10Z"
    fill="url(#gold)" />
  <!-- Unicorn head silhouette -->
  <g fill="url(#gold)" transform="translate(80,40)">
    <!-- Horn -->
    <polygon points="40,0 32,30 48,30" fill="#f6de88"/>
    <!-- Head -->
    <ellipse cx="40" cy="48" rx="22" ry="26" fill="url(#gold)"/>
    <!-- Neck -->
    <path d="M28,68 Q20,90 25,110 L55,110 Q60,90 52,68Z" fill="url(#gold)"/>
    <!-- Mane flowing back -->
    <path d="M52,45 Q75,35 85,20 Q80,45 75,60 Q70,50 52,58Z" fill="#f6de88"/>
    <path d="M52,58 Q72,55 82,42 Q78,62 70,72 Q65,62 52,65Z" fill="#d4a843"/>
    <!-- Eye -->
    <circle cx="35" cy="44" r="4" fill="#1a0505"/>
    <circle cx="36" cy="43" r="1.5" fill="#f6de88"/>
    <!-- Nostril -->
    <ellipse cx="30" cy="58" rx="3" ry="2" fill="#b8922f"/>
    <!-- Ear -->
    <polygon points="50,25 58,10 62,28" fill="#d4a843"/>
  </g>
</svg>
